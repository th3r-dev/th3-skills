name: containers

on:
  push:
    branches: [main]
    paths:
      - 'skills/containers/**'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'skills/containers/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/containers

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: "python -m pip install --only-binary :all: pytest==9.2.0"
      - name: Run tests
        run: python -m pytest -q
      - name: Script self-checks
        run: python podman/scripts/reclaim.py --help > /dev/null
