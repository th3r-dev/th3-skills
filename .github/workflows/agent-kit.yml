name: agent-kit

on:
  push:
    branches: [main]
    paths:
      - 'skills/agent-kit/**'
      - '.github/workflows/agent-kit.yml'
  pull_request:
    paths:
      - 'skills/agent-kit/**'
      - '.github/workflows/agent-kit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/agent-kit

jobs:
  test:
    name: self-checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
      - name: Python
        run: uv venv
      - name: Script self-checks (stdlib only, nothing installed)
        run: |
          .venv/bin/python cost/scripts/agent_guard.py --selftest
          .venv/bin/python prompt-cache/scripts/pcache.py --self-test
