name: software-engineer

on:
  push:
    branches: [main]
    paths:
      - 'skills/shipped/software-engineer/**'
      - '.github/workflows/software-engineer.yml'
  pull_request:
    paths:
      - 'skills/shipped/software-engineer/**'
      - '.github/workflows/software-engineer.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/shipped/software-engineer

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: "uv venv && uv pip install --no-build pytest==9.2.0"
      - name: Run tests
        run: uv run --no-project python -m pytest -q
      - name: Script self-checks
        run: uv run --no-project python release-docs/scripts/check_report.py --selftest
