name: devops

on:
  push:
    branches: [main]
    paths:
      - 'skills/devops/**'
      - '.github/workflows/devops.yml'
  pull_request:
    paths:
      - 'skills/devops/**'
      - '.github/workflows/devops.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/devops

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --only-binary :all: pytest==9.2.0 pymupdf==2.1 numpy==2.5.4 pillow==13.0.0
      - name: Run tests
        run: python -m pytest -q
      - name: Script self-checks
        run: |
          python release-scope/scripts/release_scope.py --selftest
          python change/scripts/jssh.py --help > /dev/null
          python network-diagram/scripts/drawio_board.py --help > /dev/null
