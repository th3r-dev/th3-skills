name: devops

on:
  push:
    branches: [main]
    paths:
      - 'skills/shipped/devops/**'
      - '.github/workflows/devops.yml'
  pull_request:
    paths:
      - 'skills/shipped/devops/**'
      - '.github/workflows/devops.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/shipped/devops

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: "uv venv && uv pip install --no-build pytest==9.2.0 pymupdf==1.28.2 numpy==2.2.6 pillow==12.3.0"
      - name: Run tests
        run: uv run --no-project python -m pytest -q
      - name: Script self-checks
        run: |
          uv run --no-project python release-scope/scripts/release_scope.py --selftest
          uv run --no-project python change/scripts/jssh.py --help > /dev/null
          uv run --no-project python network-diagram/scripts/drawio_board.py --help > /dev/null
