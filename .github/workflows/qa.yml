name: qa

on:
  push:
    branches: [main]
    paths:
      - 'skills/shipped/qa/**'
      - '.github/workflows/qa.yml'
  pull_request:
    paths:
      - 'skills/shipped/qa/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skills/shipped/qa

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: "uv venv && uv pip install --no-build pytest==9.2.0 openpyxl==3.1.5 pillow==12.3.0 requests==2.34.2"
      - name: Run tests
        run: uv run --no-project python -m pytest -q
      - name: Script self-checks
        run: |
          uv run --no-project python answer-review/scripts/qa.py selfcheck
          uv run --no-project python excel-import/scripts/run_web.py selftest
          uv run --no-project python ticket-report/scripts/ticket_report.py --selftest
