</g>
<g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" fill="#111">
<text x="80" y="104" font-family="Menlo,Consolas,monospace" font-size="18" letter-spacing="1.5">th3-skills / design</text>
<text x="76" y="318" font-size="104" font-weight="800" letter-spacing="-4">design-</text>
<text x="76" y="414" font-size="104" font-weight="800" letter-spacing="-4">core</text>
<rect x="80" y="440" width="120" height="10" fill="#FFD60A"/>
<text x="80" y="498" font-size="26">Shared rules for layout, wording</text>
<text x="80" y="532" font-size="26">and screen states. Every design skill reads them.</text>
<text x="80" y="580" font-family="Menlo,Consolas,monospace" font-size="17" fill="#111" fill-opacity=".7">hierarchy 9 · alignment 8 · copy 9 · states 8</text>

<!-- screen -->
<rect x="716" y="92" width="480" height="456" fill="#fff" stroke="#111" stroke-width="3"/>
<rect x="716" y="92" width="480" height="36" fill="#111"/>
<circle cx="738" cy="110" r="5" fill="#F3EFE4"/><circle cx="758" cy="110" r="5" fill="#F3EFE4" fill-opacity=".5"/>
<text x="756" y="196" font-size="36" font-weight="800" letter-spacing="-1">Send invoice</text>
