<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="design-core: a form screen marked up in red pen, with one focal point, equal gaps and a verb-first button.">
<title>design-core: shared design principles, shown as a marked-up screen</title>
<rect width="1280" height="640" fill="#F3EFE4"/>
<g stroke="#111" stroke-opacity=".08" stroke-width="1">
<path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
