<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="design-core: shared design principles. Headline: the default here is X, with X struck out. Right: four tiers of authority, the user's request, the product's system, platform rules, and last, this skill's defaults.">
<title>design-core: the default here is X, struck out; four tiers of authority</title>
<style>
